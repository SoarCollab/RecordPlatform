              "TEST-cn.flying.service.admin.TenantUserManagementMySqlIT.xml"
          )
          if not report.is_file():
              sys.exit(f"Missing required Failsafe report: {report}")

          suite = ET.parse(report).getroot()
          for name, expected in {"tests": 5, "skipped": 0, "failures": 0, "errors": 0}.items():
              actual = int(suite.attrib.get(name, "-1"))
              if actual != expected:
                  sys.exit(
                      f"TenantUserManagementMySqlIT {name}={actual}; expected {expected}"
                  )
          PY

