name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      contract: ${{ steps.filter.outputs.contract }}
      docs: ${{ steps.filter.outputs.docs }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            backend:
              - 'platform-api/**'
              - 'platform-verifier/**'
              - 'platform-backend/**'
              - 'platform-fisco/**'
              - 'platform-storage/**'
              - 'docs/public/nacos-config-template.yaml'
              - 'pom.xml'
              - '.github/workflows/**'
            contract:
              - 'platform-api/**'
              - 'platform-verifier/**'
              - 'platform-backend/**'
              - 'platform-fisco/src/main/resources/contract-registry/**'
              - 'platform-frontend/src/lib/api/**'
              - 'platform-frontend/scripts/generate-api-types.mjs'
              - 'platform-frontend/package.json'
              - 'platform-frontend/pnpm-lock.yaml'
              - 'platform-frontend/pnpm-workspace.yaml'
              - 'tools/contracts/**'
              - 'pom.xml'
              - '.github/workflows/**'
            docs:
              - 'ROADMAP*.md'
              - 'README.md'
              - 'README_CN.md'
              - 'API_DOCUMENTATION.md'
              - 'CONTRIBUTING.md'
              - 'TESTING.md'
              - 'docs/**'
              - 'scripts/*.md'
              - 'tools/k6/README.md'
              - 'tools/docs/**'
              - 'platform-api/pom.xml'
              - 'platform-verifier/**'
              - 'platform-backend/pom.xml'
              - 'platform-fisco/pom.xml'
              - 'platform-storage/pom.xml'
              - 'platform-frontend/package.json'
              - 'platform-frontend/pnpm-lock.yaml'
              - '.env.example'
              - 'platform-frontend/.env.example'
              - 'scripts/env.sh'
              - 'platform-backend/backend-web/src/main/java/cn/flying/controller/**'
              - 'platform-backend/backend-web/src/main/java/cn/flying/config/**'
              - 'platform-backend/backend-web/src/main/resources/application*.yml'
              - 'platform-backend/backend-web/src/main/resources/db/migration/**'
              - 'platform-backend/backend-service/src/main/java/**'
              - 'platform-backend/**/src/test/java/**'
              - '.github/workflows/docs-consistency.yml'
              - '.github/workflows/test.yml'
            build:
              - 'platform-api/**'
              - 'platform-verifier/**'
              - 'platform-backend/**'
              - 'platform-fisco/**'
              - 'platform-storage/**'
              - 'platform-frontend/**'
              - 'pom.xml'
              - 'config/**'
              - 'scripts/**'
              - 'tools/**'
              - 'docker-compose.infra.yml'
              - '.env.example'
              - 'docs/public/nacos-config-template.yaml'
              - '.github/workflows/**'

  backend-test:
    name: Backend Tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test and Install platform-api
        run: mvn -f platform-api/pom.xml clean install -q

      - name: Test and Install Public Verifier
        run: mvn -f platform-verifier/pom.xml clean install

      - name: Run Backend Tests
        run: mvn -f platform-backend/pom.xml clean verify -pl backend-common,backend-service,backend-web -am -Pit

      - name: Require Cross-Tenant Health IT Execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(
              "platform-backend/backend-web/target/failsafe-reports/"
              "TEST-cn.flying.health.CrossTenantHealthIndicatorIT.xml"
          )
          suite = ET.parse(report).getroot()
          for name, expected in {"tests": 1, "skipped": 0, "failures": 0, "errors": 0}.items():
              actual = suite.get(name)
              if actual != str(expected):
                  raise SystemExit(f"CrossTenantHealthIndicatorIT {name}={actual}; expected {expected}")
          PY

