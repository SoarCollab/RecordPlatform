name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      automation: ${{ steps.filter.outputs.automation }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            backend:
              - 'platform-api/**'
              - 'platform-verifier/**'
              - 'platform-backend/**'
              - 'platform-fisco/**'
              - 'platform-storage/**'
              - 'pom.xml'
              - '.github/workflows/**'
            frontend:
              - 'platform-frontend/**'
              - '.github/workflows/**'
            automation:
              - '.github/workflows/**'
              - 'config/**'
              - 'scripts/**'
              - 'tools/**'
              - 'docker-compose.infra.yml'
              - '.env.example'
              - 'platform-frontend/.env.example'

  backend-test:
    name: Backend Tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test and Install platform-api
        run: mvn -f platform-api/pom.xml clean install -q

      - name: Test and Install Public Verifier
        run: mvn -f platform-verifier/pom.xml clean install

      - name: Run Backend Tests
        run: mvn -f platform-backend/pom.xml clean verify -pl backend-common,backend-service,backend-web -am -Pit

      - name: Require Attestation Batch Consistency IT Execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path(
              "platform-backend/backend-web/target/failsafe-reports/"
              "TEST-cn.flying.test.attestation.AttestationBatchConsistencyIT.xml"
          )
          if not report.is_file():
              sys.exit(f"Missing required Failsafe report: {report}")

          suite = ET.parse(report).getroot()
          expected_counts = {
              "tests": 8,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          for name, expected in expected_counts.items():
              actual = int(suite.attrib.get(name, "-1"))
              if actual != expected:
                  sys.exit(
                      f"AttestationBatchConsistencyIT {name}={actual}; expected {expected}"
                  )
          PY

      - name: Require Signed Proof Concurrency IT Execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path(
              "platform-backend/backend-web/target/failsafe-reports/"
              "TEST-cn.flying.test.proof.SignedProofLifecycleConcurrencyIT.xml"
          )
          if not report.is_file():
              sys.exit(f"Missing required Failsafe report: {report}")

          suite = ET.parse(report).getroot()

          def require_count(name: str, expected: int) -> None:
              """Require an exact JUnit suite counter from the signed-proof concurrency report."""
              actual = int(suite.attrib.get(name, "-1"))
              if actual != expected:
                  sys.exit(
                      f"SignedProofLifecycleConcurrencyIT {name}={actual}; expected {expected}"
                  )

          require_count("tests", 6)
          require_count("skipped", 0)
          require_count("failures", 0)
          require_count("errors", 0)
          PY

      - name: Require Proof Status Timestamp Migration IT Execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path(
              "platform-backend/backend-web/target/failsafe-reports/"
              "TEST-cn.flying.migration.ProofStatusTimestampMigrationIT.xml"
          )
          if not report.is_file():
              sys.exit(f"Missing required Failsafe report: {report}")

          suite = ET.parse(report).getroot()
          expected_counts = {
              "tests": 1,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          for name, expected in expected_counts.items():
              actual = int(suite.attrib.get(name, "-1"))
              if actual != expected:
                  sys.exit(
                      f"ProofStatusTimestampMigrationIT {name}={actual}; expected {expected}"
                  )
          PY

      - name: Require Public Proof Audit Isolation IT Execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path(
              "platform-backend/backend-web/target/failsafe-reports/"
              "TEST-cn.flying.controller.PublicProofAuditTenantIsolationIT.xml"
          )
          if not report.is_file():
              sys.exit(f"Missing required Failsafe report: {report}")

          suite = ET.parse(report).getroot()
          expected_counts = {
              "tests": 1,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          for name, expected in expected_counts.items():
              actual = int(suite.attrib.get(name, "-1"))
              if actual != expected:
                  sys.exit(
                      f"PublicProofAuditTenantIsolationIT {name}={actual}; expected {expected}"
                  )
          PY

      - name: Require Public Proof Rate Limit IT Execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path(
              "platform-backend/backend-web/target/failsafe-reports/"
              "TEST-cn.flying.aspect.PublicProofRateLimitIT.xml"
          )
          if not report.is_file():
              sys.exit(f"Missing required Failsafe report: {report}")

          suite = ET.parse(report).getroot()
          expected_counts = {
              "tests": 1,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          for name, expected in expected_counts.items():
              actual = int(suite.attrib.get(name, "-1"))
              if actual != expected:
                  sys.exit(
                      f"PublicProofRateLimitIT {name}={actual}; expected {expected}"
                  )
          PY

      - name: Run FISCO Tests
        run: mvn -f platform-fisco/pom.xml test

      - name: Run Storage Tests
        run: mvn -f platform-storage/pom.xml test

      - name: Upload Backend OpenAPI Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-openapi
          path: platform-backend/backend-web/target/openapi/openapi.json
          if-no-files-found: error

      - name: Upload Backend Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always()
        with:
          use_oidc: true
          files: |
            platform-backend/backend-common/target/site/jacoco/jacoco.xml
            platform-backend/backend-service/target/site/jacoco/jacoco.xml
            platform-backend/backend-web/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload Verifier Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always()
        with:
          use_oidc: true
          files: platform-verifier/sdk/target/site/jacoco/jacoco.xml
          flags: verifier
          fail_ci_if_error: false

      - name: Upload Public Verifier Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-verifier
          path: |
            platform-verifier/sdk/target/platform-verifier-sdk-*.jar
            platform-verifier/cli-verifier/target/record-platform-verifier-exec.jar
            platform-verifier/web-verifier/target/platform-verifier-web.jar
            platform-verifier/sdk/target/verifier-fixtures/**
          if-no-files-found: error

  frontend-test:
    name: Frontend Tests
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: platform-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Check Formatting
        run: pnpm format:check

      - name: Run Lint
        run: pnpm lint

      - name: Run Type Check
        run: pnpm check

      - name: Run Tests with Coverage
        run: pnpm test:coverage

      - name: Upload Frontend Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always()
        with:
          use_oidc: true
          files: platform-frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  contract-consistency:
    name: Contract Consistency
    runs-on: ubuntu-latest
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Backend OpenAPI Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-openapi
          path: backend-openapi

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform-frontend
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Generate And Verify Frontend API Types
        working-directory: platform-frontend
        run: OPENAPI_SOURCE=../backend-openapi/openapi.json pnpm types:gen:check

      - name: Verify Contract Artifact Integrity
        run: |
          python3 -m unittest discover -s tools/contracts/tests -v
          python3 tools/contracts/contract_fingerprint.py verify \
            --project-root . \
            --catalog platform-fisco/src/main/resources/contract-registry/artifacts.json

      - name: Generate Contract Fingerprints
        run: |
          mkdir -p contract-fingerprint
          shasum -a 256 backend-openapi/openapi.json | awk '{print $1}' > contract-fingerprint/openapi.sha256
          shasum -a 256 platform-frontend/src/lib/api/types/generated.ts | awk '{print $1}' > contract-fingerprint/generated-ts.sha256
          shasum -a 256 platform-fisco/src/main/resources/contract-registry/artifacts.json | awk '{print $1}' > contract-fingerprint/catalog.sha256
          python3 tools/contracts/contract_fingerprint.py refresh \
            --project-root . \
            --catalog platform-fisco/src/main/resources/contract-registry/artifacts.json \
            --output contract-fingerprint/verified-artifacts.json

      - name: Upload Contract Fingerprints
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: contract-fingerprint
          path: contract-fingerprint
          if-no-files-found: error

  security-scan:
    name: Security Scan
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run Trivy SARIF output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-pr.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: trivy-pr.sarif
          category: trivy-pr

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [changes, backend-test, frontend-test, contract-consistency]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.automation == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Backend
        run: |
          mvn -f platform-api/pom.xml clean install -DskipTests -q
          mvn -f platform-verifier/pom.xml clean install -q
          mvn -f platform-backend/pom.xml clean package -DskipTests -q
          mvn -f platform-fisco/pom.xml clean package -DskipTests -q
          mvn -f platform-storage/pom.xml clean package -DskipTests -q

      - name: Build Backend and Public Verifier Images
        run: |
          docker build -f platform-backend/Dockerfile -t recordplatform-backend:pr .
          docker build -f platform-verifier/web-verifier/Dockerfile -t recordplatform-verifier-web:pr .

      - name: Verify Public Verifier Container
        run: |
          verifier_uid="$(docker run --rm --entrypoint id recordplatform-verifier-web:pr -u)"
          test "$verifier_uid" != "0"

          container_id="$(docker run -d \
            --read-only \
            --tmpfs /tmp/record-platform-verifier:rw,noexec,nosuid,size=64m,mode=1777 \
            -p 127.0.0.1:18093:8093 \
            recordplatform-verifier-web:pr)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18093/actuator/health >/tmp/verifier-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          jq -e '.status == "UP"' /tmp/verifier-health.json

          status="$(curl --silent --show-error \
            --output /tmp/verifier-report.json \
            --write-out '%{http_code}' \
            --form original=@platform-verifier/sdk/target/verifier-fixtures/original.txt \
            --form proof=@platform-verifier/sdk/target/verifier-fixtures/proof.zip \
            --form trustedKey=@platform-verifier/sdk/target/verifier-fixtures/trusted-key.json \
            http://127.0.0.1:18093/api/v1/verify)"
          test "$status" = "200"
          jq -e '.outcome == "INDETERMINATE"' /tmp/verifier-report.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-frontend/pnpm-lock.yaml

      - name: Build Frontend
        working-directory: platform-frontend
        run: |
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build
