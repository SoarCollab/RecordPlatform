              if actual != expected:
                  sys.exit(
                      f"DegradedWriteTrackerRedisIT {name}={actual}; expected {expected}"
                  )
          PY

      - name: Run Direct Upload Constrained Heap Test
        run: mvn -f platform-storage/pom.xml verify -Pdirect-upload-constrained-heap

      - name: Require Direct Upload Constrained Heap Execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path(
              "platform-storage/target/failsafe-reports/"
              "TEST-cn.flying.storage.service.DirectUploadConstrainedHeapIT.xml"
          )
          if not report.is_file():
              sys.exit(f"Missing required Failsafe report: {report}")

          suite = ET.parse(report).getroot()
          expected_counts = {
              "tests": 1,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          for name, expected in expected_counts.items():
              actual = int(suite.attrib.get(name, "-1"))
              if actual != expected:
                  sys.exit(
                      f"DirectUploadConstrainedHeapIT {name}={actual}; expected {expected}"
                  )
          PY

      - name: Upload Backend OpenAPI Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-openapi
          path: platform-backend/backend-web/target/openapi/openapi.json
          if-no-files-found: error

      - name: Upload Backend Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always()
        with:
          use_oidc: true
          files: platform-backend/backend-common/target/site/jacoco/jacoco.xml,platform-backend/backend-service/target/site/jacoco/jacoco.xml,platform-backend/backend-web/target/site/jacoco/jacoco.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Verifier Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always()
        with:
          use_oidc: true
          files: platform-verifier/sdk/target/site/jacoco/jacoco.xml
          flags: verifier
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Public Verifier Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-verifier
          path: |
            platform-verifier/sdk/target/platform-verifier-sdk-*.jar
            platform-verifier/cli-verifier/target/record-platform-verifier-exec.jar
            platform-verifier/web-verifier/target/platform-verifier-web.jar
            platform-verifier/sdk/target/verifier-fixtures/**
          if-no-files-found: error

  frontend-test:
    name: Frontend Tests
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: platform-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Audit frontend production and development dependencies
        working-directory: .
        run: |
          for attempt in 1 2; do
            if corepack pnpm@10.26.1 -C platform-frontend audit --audit-level high; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Frontend dependency audit failed after $attempt attempts"
              exit 1
            fi
            echo "Frontend dependency audit request failed; retrying in 20 seconds"
            sleep 20
          done

      - name: Check Formatting
        run: pnpm format:check

      - name: Run Lint
        run: pnpm lint

      - name: Run Type Check
        run: pnpm check

      - name: Run Tests with Coverage
        run: pnpm test:coverage

      - name: Upload Frontend Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: always()
        with:
          use_oidc: true
          files: platform-frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: true

  contract-consistency:
    name: Contract Consistency
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.contract == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install OpenAPI contract dependencies
        run: |
          mvn -f platform-api/pom.xml clean install -DskipTests -q
          mvn -f platform-verifier/pom.xml -pl sdk -am clean install -DskipTests -q

      - name: Export OpenAPI from the checked-out revision
        run: >-
          mvn -f platform-backend/pom.xml
          -pl backend-web
          -am
          -Dtest=OpenApiContractExportTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: platform-frontend
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Generate And Verify Frontend API Types
        working-directory: platform-frontend
        run: OPENAPI_SOURCE=../platform-backend/backend-web/target/openapi/openapi.json pnpm types:gen:check

      - name: Verify Contract Artifact Integrity
        run: |
          python3 -m unittest discover -s tools/contracts/tests -v
          python3 tools/contracts/contract_fingerprint.py verify \
            --project-root . \
            --catalog platform-fisco/src/main/resources/contract-registry/artifacts.json

      - name: Generate Contract Fingerprints
        run: |
          mkdir -p contract-fingerprint
          shasum -a 256 platform-backend/backend-web/target/openapi/openapi.json | awk '{print $1}' > contract-fingerprint/openapi.sha256
          shasum -a 256 platform-frontend/src/lib/api/types/generated.ts | awk '{print $1}' > contract-fingerprint/generated-ts.sha256
          shasum -a 256 platform-fisco/src/main/resources/contract-registry/artifacts.json | awk '{print $1}' > contract-fingerprint/catalog.sha256
          python3 tools/contracts/contract_fingerprint.py refresh \
            --project-root . \
            --catalog platform-fisco/src/main/resources/contract-registry/artifacts.json \
            --output contract-fingerprint/verified-artifacts.json

      - name: Upload Contract Fingerprints
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: contract-fingerprint
          path: contract-fingerprint
          if-no-files-found: error

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run Trivy SARIF output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-pr.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: trivy-pr.sarif
          category: trivy-pr

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

  docs-verification:
    name: Docs Verification
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-consistency.yml

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [changes, backend-test, frontend-test, contract-consistency, security-scan]
    if: always() && !failure() && !cancelled() && needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require Exact MinIO Direct Upload Origins
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          from urllib.parse import urlsplit
          import sys

          env_lines = Path(".env.example").read_text(encoding="utf-8").splitlines()
          values = [
              line.split("=", 1)[1]
              for line in env_lines
              if line.startswith("CORS_ALLOWED_ORIGINS=")
          ]
          if len(values) != 1:
              sys.exit(".env.example must define CORS_ALLOWED_ORIGINS exactly once")
          origins = values[0].split(",")
          if not origins or any(origin != origin.strip() for origin in origins):
              sys.exit("MinIO origins must be comma-separated without surrounding spaces")
          for origin in origins:
              parsed = urlsplit(origin)
              if (
                  "*" in origin
                  or parsed.scheme not in {"http", "https"}
                  or not parsed.netloc
                  or parsed.hostname is None
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.path
                  or parsed.query
                  or parsed.fragment
              ):
                  sys.exit(f"Unsafe MinIO direct-upload origin: {origin}")

          resolved = subprocess.run(
              [
                  "docker",
                  "compose",
                  "--env-file",
                  ".env.example",
                  "-f",
                  "docker-compose.infra.yml",
                  "config",
                  "--format",
                  "json",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          compose = json.loads(resolved.stdout)
          services = compose.get("services")
          if not isinstance(services, dict):
              sys.exit("Resolved Compose config is missing services")
          for service_name in ("minio-a", "minio-b"):
              service = services.get(service_name)
              environment = service.get("environment") if isinstance(service, dict) else None
              if not isinstance(environment, dict):
                  sys.exit(f"Resolved Compose service {service_name} is missing environment")
              actual = environment.get("MINIO_API_CORS_ALLOW_ORIGIN")
              if actual != values[0]:
                  sys.exit(
                      f"{service_name} MINIO_API_CORS_ALLOW_ORIGIN={actual!r}; "
                      f"expected exact CORS_ALLOWED_ORIGINS value {values[0]!r}"
                  )

          def direct_upload_defaults(path: str) -> dict[str, str]:
              """Parse the flat storage.direct-upload scalar block without accepting comments as config."""
              result: dict[str, str] = {}
              in_storage = False
              in_direct_upload = False
              for line_number, raw_line in enumerate(
                  Path(path).read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  if "\t" in raw_line:
                      sys.exit(f"{path}:{line_number} contains a tab")
                  stripped = raw_line.strip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  indent = len(raw_line) - len(raw_line.lstrip(" "))
                  if indent == 0:
                      if in_direct_upload:
                          break
                      in_storage = stripped == "storage:"
                      continue
                  if not in_storage:
                      continue
                  if indent == 2:
                      if in_direct_upload:
                          break
                      in_direct_upload = stripped == "direct-upload:"
                      continue
                  if not in_direct_upload:
                      continue
                  if indent != 4:
                      sys.exit(f"{path}:{line_number} direct-upload must remain a flat scalar map")
                  declaration = stripped.split("#", 1)[0].rstrip()
                  key, separator, value = declaration.partition(":")
                  if not separator or not key or not value.strip() or key in result:
                      sys.exit(f"{path}:{line_number} has an invalid direct-upload entry")
                  result[key] = value.strip()
              if not in_direct_upload:
                  sys.exit(f"{path} is missing storage.direct-upload")
              return result

          expected_defaults = {
              "max-file-size-bytes": "4294967296",
              "max-part-size-bytes": "104857600",
              "stream-buffer-bytes": "65536",
              "transfer-timeout-seconds": "300",
              "lock-wait-seconds": "5",
              "staging-retention-hours": "48",
              "cleanup-enabled": "true",
              "cleanup-interval-millis": "3600000",
              "cleanup-initial-delay-millis": "300000",
              "cleanup-batch-size": "200",
              "cleanup-claim-lease-seconds": "600",
          }
          for config_path in (
              "platform-storage/src/main/resources/application.yml",
              "docs/public/nacos-config-template.yaml",
          ):
              actual_defaults = direct_upload_defaults(config_path)
              if actual_defaults != expected_defaults:
                  sys.exit(
                      f"{config_path} storage.direct-upload defaults drifted: "
                      f"actual={actual_defaults!r}, expected={expected_defaults!r}"
                  )
          PY

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Backend
        run: |
          mvn -f platform-api/pom.xml clean install -DskipTests -q
          mvn -f platform-verifier/pom.xml clean install -q
          mvn -f platform-backend/pom.xml clean package -DskipTests -q
          mvn -f platform-fisco/pom.xml clean package -DskipTests -q
          mvn -f platform-storage/pom.xml clean package -DskipTests -q

      - name: Build Backend, FISCO, Storage and Public Verifier Images
        run: |
          docker build -f platform-backend/Dockerfile -t recordplatform-backend:pr .
          docker build -f platform-fisco/Dockerfile -t recordplatform-fisco:pr .
          docker build -f platform-storage/Dockerfile -t recordplatform-storage:pr .
          docker build -f platform-verifier/web-verifier/Dockerfile -t recordplatform-verifier-web:pr .

      - name: Verify FISCO Non-Root Nonce Volume
        run: |
          fisco_uid="$(docker run --rm --entrypoint id recordplatform-fisco:pr -u)"
          test "$fisco_uid" != "0"

          volume_name="recordplatform-fisco-nonce-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume_name" >/dev/null
          trap 'docker volume rm -f "$volume_name" >/dev/null 2>&1 || true' EXIT

          docker run --rm \
            --read-only \
            --entrypoint sh \
            -v "$volume_name:/var/lib/record-platform/besu-nonce" \
            recordplatform-fisco:pr \
            -c 'test "$(id -u)" != "0" && touch /var/lib/record-platform/besu-nonce/first.state'

          docker run --rm \
            --read-only \
            --entrypoint sh \
            -v "$volume_name:/var/lib/record-platform/besu-nonce" \
            recordplatform-fisco:pr \
            -c 'test -f /var/lib/record-platform/besu-nonce/first.state && touch /var/lib/record-platform/besu-nonce/second.state'

      - name: Verify Public Verifier Container
        run: |
          verifier_uid="$(docker run --rm --entrypoint id recordplatform-verifier-web:pr -u)"
          test "$verifier_uid" != "0"

          container_id="$(docker run -d \
            --read-only \
            --tmpfs /tmp/record-platform-verifier:rw,noexec,nosuid,size=64m,mode=1777 \
            -p 127.0.0.1:18093:8093 \
            recordplatform-verifier-web:pr)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18093/actuator/health >/tmp/verifier-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          jq -e '.status == "UP"' /tmp/verifier-health.json

          status="$(curl --silent --show-error \
            --output /tmp/verifier-report.json \
            --write-out '%{http_code}' \
            --form original=@platform-verifier/sdk/target/verifier-fixtures/original.txt \
            --form proof=@platform-verifier/sdk/target/verifier-fixtures/proof.zip \
            --form trustedKey=@platform-verifier/sdk/target/verifier-fixtures/trusted-key.json \
            http://127.0.0.1:18093/api/v1/verify)"
          test "$status" = "200"
          jq -e '.outcome == "INDETERMINATE"' /tmp/verifier-report.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-frontend/pnpm-lock.yaml

      - name: Build Frontend
        working-directory: platform-frontend
        run: |
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Frontend Docker Image
        run: docker build -f platform-frontend/Dockerfile -t recordplatform-frontend:ci platform-frontend

  required-ci:
    name: Required CI
    needs:
      - changes
      - backend-test
      - frontend-test
      - contract-consistency
      - security-scan
      - docs-verification
      - build-check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Required CI policy tests
        run: python3 -m unittest discover -s tools/ci/tests -v

      - name: Validate monitoring rules with pinned Prometheus
        run: bash tools/ci/check-monitoring.sh

      - name: Initialize pinned k6 runtime without network access
        run: |
          node --experimental-vm-modules --test tools/k6/tests/*.test.mjs
          bash tools/k6/check-runtime.sh docker

      - name: Enforce required and inapplicable job results
        run: |
          python3 tools/ci/required_ci_gate.py \
            --backend-changed "${{ needs.changes.outputs.backend }}" \
            --contract-changed "${{ needs.changes.outputs.contract }}" \
            --docs-changed "${{ needs.changes.outputs.docs }}" \
            --build-changed "${{ needs.changes.outputs.build }}" \
            --changes-result "${{ needs.changes.result }}" \
            --backend-test-result "${{ needs.backend-test.result }}" \
            --frontend-test-result "${{ needs.frontend-test.result }}" \
            --contract-consistency-result "${{ needs.contract-consistency.result }}" \
            --security-scan-result "${{ needs.security-scan.result }}" \
            --docs-verification-result "${{ needs.docs-verification.result }}" \
            --build-check-result "${{ needs.build-check.result }}"
