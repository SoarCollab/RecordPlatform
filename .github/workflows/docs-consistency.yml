name: Docs Consistency

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-openapi:
    name: Export OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install platform-api
        run: mvn -f platform-api/pom.xml clean install -DskipTests -q

      - name: Install verifier SDK
        run: mvn -f platform-verifier/pom.xml -pl sdk -am clean install -DskipTests -q

      - name: Export OpenAPI
        run: >-
          mvn -f platform-backend/pom.xml
          -pl backend-web
          -am
          -Dtest=OpenApiContractExportTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-backend-openapi
          path: platform-backend/backend-web/target/openapi/openapi.json
          if-no-files-found: error

  docs-consistency:
    name: Check Docs Consistency
    runs-on: ubuntu-latest
    needs: export-openapi
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-backend-openapi
          path: platform-backend/backend-web/target/openapi

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run consistency checks
        run: |
          python3 -m unittest discover -s tools/docs/tests -p 'test_*.py'
          python3 tools/docs/check_consistency.py \
            --check-routes \
            --check-env \
            --check-roadmap \
            --check-versions \
            --check-evidence

  docs-build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    needs: docs-consistency
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        run: pnpm -C docs install --frozen-lockfile

      - name: Audit docs production and development dependencies
        run: corepack pnpm@10.26.1 -C docs audit --audit-level high

      - name: Build docs
        run: pnpm -C docs docs:build
