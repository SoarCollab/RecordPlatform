name: Docs Consistency

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-openapi:
    name: Export OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install platform-api
        run: mvn -f platform-api/pom.xml clean install -DskipTests -q

      - name: Install verifier SDK
        run: mvn -f platform-verifier/pom.xml -pl sdk -am clean install -DskipTests -q

      - name: Export OpenAPI
        run: >-
          mvn -f platform-backend/pom.xml
          -pl backend-web
          -am
          -Dtest=OpenApiContractExportTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-backend-openapi
          path: platform-backend/backend-web/target/openapi/openapi.json
          if-no-files-found: error

  docs-consistency:
    name: Check Docs Consistency
    runs-on: ubuntu-latest
    needs: export-openapi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-backend-openapi
          path: platform-backend/backend-web/target/openapi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Run consistency checks
        run: |
          python3 -m unittest discover -s tools/docs/tests -p 'test_*.py'
          python3 tools/docs/check_consistency.py \
            --check-routes \
            --check-env \
            --check-roadmap \
            --check-versions \
            --check-evidence

  docs-build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    needs: docs-consistency
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        run: pnpm -C docs install --frozen-lockfile

      - name: Audit docs production and development dependencies
        run: |
          for attempt in 1 2; do
            if corepack pnpm@10.26.1 -C docs audit --audit-level high; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Docs dependency audit failed after $attempt attempts"
              exit 1
            fi
            echo "Docs dependency audit request failed; retrying in 20 seconds"
            sleep 20
          done

      - name: Build docs
        run: pnpm -C docs docs:build
