name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── Java build ────────────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all Java modules
        run: |
          mvn -f platform-api/pom.xml clean install -DskipTests -q
          mvn -f platform-verifier/pom.xml clean install -q
          mvn -f platform-backend/pom.xml clean package -DskipTests -q
          mvn -f platform-fisco/pom.xml clean package -DskipTests -q
          mvn -f platform-storage/pom.xml clean package -DskipTests -q

      - name: Package public verifier release files
        run: |
          mkdir -p platform-verifier/target
          tar \
            --sort=name \
            --mtime='1980-01-02 00:00:00Z' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf platform-verifier/target/record-platform-verifier-fixture.tar.gz \
            -C platform-verifier/sdk/target/verifier-fixtures .
          artifacts=(
            platform-verifier/sdk/target/platform-verifier-sdk-0.0.2-SNAPSHOT.jar
            platform-verifier/cli-verifier/target/record-platform-verifier-exec.jar
            platform-verifier/web-verifier/target/platform-verifier-web.jar
            platform-verifier/target/record-platform-verifier-fixture.tar.gz
          )
          : > platform-verifier/target/record-platform-verifier-SHA256SUMS
          for artifact in "${artifacts[@]}"; do
            digest="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$(basename "$artifact")" \
              >> platform-verifier/target/record-platform-verifier-SHA256SUMS
          done
          if grep -qE '  .*/' platform-verifier/target/record-platform-verifier-SHA256SUMS; then
            echo 'Release checksum entries must use downloadable asset basenames' >&2
            exit 1
          fi

      # ── Frontend build ─────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.26.1

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform-frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: platform-frontend
        run: |
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build

      # ── SBOM ───────────────────────────────────────────────────────────────
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      # ── Docker image build, no registry token in this job ─────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # backend
      - name: Docker metadata -- backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/recordplatform-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build image -- backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: platform-backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Save image -- backend
        env:
          IMAGE_TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          mkdir -p release-images
          printf '%s\n' "$IMAGE_TAGS" > release-images/backend.tags
          mapfile -t image_tags < <(printf '%s\n' "$IMAGE_TAGS")
          docker save "${image_tags[@]}" -o release-images/backend.tar

      # public verifier
      - name: Docker metadata -- public verifier
        id: meta-verifier
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/recordplatform-verifier-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build image -- public verifier
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: platform-verifier/web-verifier/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-verifier.outputs.tags }}
          labels: ${{ steps.meta-verifier.outputs.labels }}
          cache-from: type=gha,scope=verifier
          cache-to: type=gha,mode=max,scope=verifier

      - name: Save image -- public verifier
        env:
          IMAGE_TAGS: ${{ steps.meta-verifier.outputs.tags }}
        run: |
          mkdir -p release-images
          printf '%s\n' "$IMAGE_TAGS" > release-images/verifier.tags
          mapfile -t image_tags < <(printf '%s\n' "$IMAGE_TAGS")
          docker save "${image_tags[@]}" -o release-images/verifier.tar

      # fisco
      - name: Docker metadata -- fisco
        id: meta-fisco
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/recordplatform-fisco
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build image -- fisco
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: platform-fisco/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-fisco.outputs.tags }}
          labels: ${{ steps.meta-fisco.outputs.labels }}
          cache-from: type=gha,scope=fisco
          cache-to: type=gha,mode=max,scope=fisco

      - name: Save image -- fisco
        env:
          IMAGE_TAGS: ${{ steps.meta-fisco.outputs.tags }}
        run: |
          mkdir -p release-images
          printf '%s\n' "$IMAGE_TAGS" > release-images/fisco.tags
          mapfile -t image_tags < <(printf '%s\n' "$IMAGE_TAGS")
          docker save "${image_tags[@]}" -o release-images/fisco.tar

      # storage
      - name: Docker metadata -- storage
        id: meta-storage
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/recordplatform-storage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build image -- storage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: platform-storage/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-storage.outputs.tags }}
          labels: ${{ steps.meta-storage.outputs.labels }}
          cache-from: type=gha,scope=storage
          cache-to: type=gha,mode=max,scope=storage

      - name: Save image -- storage
        env:
          IMAGE_TAGS: ${{ steps.meta-storage.outputs.tags }}
        run: |
          mkdir -p release-images
          printf '%s\n' "$IMAGE_TAGS" > release-images/storage.tags
          mapfile -t image_tags < <(printf '%s\n' "$IMAGE_TAGS")
          docker save "${image_tags[@]}" -o release-images/storage.tar

      # frontend
      - name: Docker metadata -- frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/recordplatform-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build image -- frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: platform-frontend
          file: platform-frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Save image -- frontend
        env:
          IMAGE_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          mkdir -p release-images
          printf '%s\n' "$IMAGE_TAGS" > release-images/frontend.tags
          mapfile -t image_tags < <(printf '%s\n' "$IMAGE_TAGS")
          docker save "${image_tags[@]}" -o release-images/frontend.tar

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            sbom.cdx.json
            platform-verifier/sdk/target/platform-verifier-sdk-0.0.2-SNAPSHOT.jar
            platform-verifier/cli-verifier/target/record-platform-verifier-exec.jar
            platform-verifier/web-verifier/target/platform-verifier-web.jar
            platform-verifier/target/record-platform-verifier-fixture.tar.gz
            platform-verifier/target/record-platform-verifier-SHA256SUMS
            release-images/*.tar
            release-images/*.tags
            tools/ci/verify_public_images.py
          retention-days: 1

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Docker images
        run: |
          for image in release-bundle/release-images/*.tar; do
            docker load -i "$image"
          done

      - name: Push Docker images
        run: |
          for tag_file in release-bundle/release-images/*.tags; do
            while IFS= read -r tag; do
              [ -n "$tag" ] && docker push "$tag"
            done < "$tag_file"
          done

      - name: Verify anonymous image pulls
        timeout-minutes: 30
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 release-bundle/tools/ci/verify_public_images.py \
            --images-dir release-bundle/release-images \
            --owner "$IMAGE_OWNER"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            release-bundle/sbom.cdx.json
            release-bundle/platform-verifier/sdk/target/platform-verifier-sdk-0.0.2-SNAPSHOT.jar
            release-bundle/platform-verifier/cli-verifier/target/record-platform-verifier-exec.jar
            release-bundle/platform-verifier/web-verifier/target/platform-verifier-web.jar
            release-bundle/platform-verifier/target/record-platform-verifier-fixture.tar.gz
            release-bundle/platform-verifier/target/record-platform-verifier-SHA256SUMS
