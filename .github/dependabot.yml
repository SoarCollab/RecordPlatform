  # npm - platform-frontend
  - package-ecosystem: npm
    directory: /platform-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # SvelteKit 的 minor/patch 会带来 Node/Vite/TS 的连锁最低版本要求，单独成组评审。
      framework:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "typescript"
        update-types:
          - minor
          - patch
      minor-and-patch:
        exclude-patterns:
          - "@sveltejs/*"
          - "svelte"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "typescript"
        update-types:
          - minor
          - patch

