version: 2

updates:
  # Maven - platform-api
  - package-ecosystem: maven
    directory: /platform-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # 这些依赖在 patch 级别就可能破坏编译/运行（包移动、API 移除），必须单独评审。
      breaking-at-patch:
        patterns:
          - "com.baomidou:mybatis-plus*"
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
          - "com.alibaba.cloud:*"
          - "org.apache.dubbo:*"
          - "org.web3j:*"
        update-types:
          - minor
          - patch
      minor-and-patch:
        exclude-patterns:
          - "com.baomidou:mybatis-plus*"
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
          - "com.alibaba.cloud:*"
          - "org.apache.dubbo:*"
          - "org.web3j:*"
        update-types:
          - minor
          - patch

