# ==============================================================================
# Prometheus SLI Recording Rules — RecordPlatform
# ==============================================================================
#
# Purpose:
#   Pre-compute SLI (Service Level Indicator) metrics at multiple time windows
#   to power SLO dashboards and burn-rate alerting without expensive real-time
#   aggregation on every Grafana panel load.
#
# How to load:
#   Add this file to your Prometheus configuration:
#
#     rule_files:
#       - /etc/prometheus/recording-rules.yml
#       - /etc/prometheus/alerting-rules.yml
#
#   Then reload Prometheus: kill -HUP $(pidof prometheus)
#   or POST /-/reload if --web.enable-lifecycle is set.
#
# Metric sources:
#   saga_total{status}         — Micrometer counter (SagaMetrics.java)
#                                      status: started | completed | compensated | failed
#   otel_blockchain_operation_duration_seconds_bucket{operation,le,exported_job}
#                                    — FISCO metrics exported via OTel Collector Prometheus exporter
#                                      (collector namespace prefix "otel")
#                                      operation: storeFile | queryFile | deleteFile | shareFile
#   s3_node_online_status{node,fault_domain}
#                                    — backend-web bridged gauge from StorageCapacityVO, 1=online 0=offline
#   s3_node_usage_percent{node,fault_domain}
#                                    — backend-web bridged gauge from StorageCapacityVO, value range 0-100
#   http_server_requests_seconds_count{status} — Spring Boot Actuator (Micrometer)
# ==============================================================================

groups:
  # ============================================================================
  # Upload Success Ratio — multi-window pre-computation
  # SLO target: 99.5% upload success rate
  # ============================================================================
  - name: sli:upload_success
    interval: 30s
    rules:
      # 5-minute window
      - record: sli:upload_success:ratio_rate5m
        expr: |
          sum(rate(saga_total{status="completed"}[5m]))
          /
          (
            sum(rate(saga_total{status="completed"}[5m]))
            + sum(rate(saga_total{status="failed"}[5m]))
            + sum(rate(saga_total{status="compensated"}[5m]))
          )

      # 30-minute window
      - record: sli:upload_success:ratio_rate30m
        expr: |
          sum(rate(saga_total{status="completed"}[30m]))
          /
          (
            sum(rate(saga_total{status="completed"}[30m]))
            + sum(rate(saga_total{status="failed"}[30m]))
            + sum(rate(saga_total{status="compensated"}[30m]))
          )

      # 1-hour window
      - record: sli:upload_success:ratio_rate1h
        expr: |
          sum(rate(saga_total{status="completed"}[1h]))
          /
          (
            sum(rate(saga_total{status="completed"}[1h]))
            + sum(rate(saga_total{status="failed"}[1h]))
            + sum(rate(saga_total{status="compensated"}[1h]))
          )

      # 6-hour window
      - record: sli:upload_success:ratio_rate6h
        expr: |
          sum(rate(saga_total{status="completed"}[6h]))
          /
          (
            sum(rate(saga_total{status="completed"}[6h]))
            + sum(rate(saga_total{status="failed"}[6h]))
            + sum(rate(saga_total{status="compensated"}[6h]))
          )

      # 1-day window
      - record: sli:upload_success:ratio_rate1d
        expr: |
          sum(rate(saga_total{status="completed"}[1d]))
          /
          (
            sum(rate(saga_total{status="completed"}[1d]))
            + sum(rate(saga_total{status="failed"}[1d]))
            + sum(rate(saga_total{status="compensated"}[1d]))
          )

      # 30-day window (rolling SLO compliance)
      - record: sli:upload_success:ratio_rate30d
        expr: |
          sum(rate(saga_total{status="completed"}[30d]))
          /
          (
            sum(rate(saga_total{status="completed"}[30d]))
            + sum(rate(saga_total{status="failed"}[30d]))
            + sum(rate(saga_total{status="compensated"}[30d]))
          )

  # ============================================================================
  # Attestation (Blockchain) Latency — P99 pre-computation
  # SLO target: P99 <= 5s for storeFile operation
  #
  # The OTel Micrometer bridge exports timers as histograms in seconds, not
  # client-side quantiles. Rate each counter before aggregating across instances.
  # No observations remain undefined; never invent zero latency for missing data.
  # ============================================================================
  - name: sli:attestation_latency
    interval: 30s
    rules:
      # P99 — histogram estimate over observations in the named window
      - record: sli:attestation_latency:p99_5m
        expr: |
          histogram_quantile(0.99, sum by (le) (
            rate(otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile"}[5m])
          ))

      - record: sli:attestation_latency:p99_30m
        expr: |
          histogram_quantile(0.99, sum by (le) (
            rate(otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile"}[30m])
          ))

      - record: sli:attestation_latency:p99_1h
        expr: |
          histogram_quantile(0.99, sum by (le) (
            rate(otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile"}[1h])
          ))

  # ============================================================================
  # Storage Availability — node online ratio
  # SLO target: >= 99.9% storage availability
  # ============================================================================
  - name: sli:storage_availability
    interval: 30s
    rules:
      # backend-web only keeps gauges for nodes present in the latest storage
      # capacity snapshot, so the denominator reflects currently managed nodes.
      #
      # IMPORTANT: s3_node_online_status is also exported by platform-storage
      # (S3Monitor, raw Prometheus client, node label only). Scope to the
      # backend-web bridge by requiring the bridge-only fault_domain label.
      - record: sli:storage_availability:ratio_current
        expr: |
          avg(
            max by (node, fault_domain) (
              s3_node_online_status{fault_domain=~".+"}
            )
          )

      # 30-day rolling SLI derived from the point-in-time managed-node ratio.
      # This preserves historical downtime after nodes recover, matching the
      # SLO/error-budget semantics documented for storage availability.
      - record: sli:storage_availability:ratio_rolling30d
        expr: |
          avg_over_time(
            avg(
              max by (node, fault_domain) (
                s3_node_online_status{fault_domain=~".+"}
              )
            )[30d:30s]
          )

  # ============================================================================
  # API Error Rate (5xx) — multi-window pre-computation
  # SLO target: <= 0.5% 5xx error rate
  # ============================================================================
  - name: sli:api_error
    interval: 30s
    rules:
      # 5-minute window
      - record: sli:api_error:ratio_rate5m
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="recordplatform-backend",status=~"5.."}[5m]))
            or 0 * sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[5m])))
          /
          sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[5m]))

      # 30-minute window
      - record: sli:api_error:ratio_rate30m
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="recordplatform-backend",status=~"5.."}[30m]))
            or 0 * sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[30m])))
          /
          sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[30m]))

      # 1-hour window
      - record: sli:api_error:ratio_rate1h
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="recordplatform-backend",status=~"5.."}[1h]))
            or 0 * sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[1h])))
          /
          sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[1h]))

      # 6-hour window
      - record: sli:api_error:ratio_rate6h
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="recordplatform-backend",status=~"5.."}[6h]))
            or 0 * sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[6h])))
          /
          sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[6h]))

      # 1-day window
      - record: sli:api_error:ratio_rate1d
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="recordplatform-backend",status=~"5.."}[1d]))
            or 0 * sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[1d])))
          /
          sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[1d]))

      # 30-day window (rolling SLO compliance)
      - record: sli:api_error:ratio_rate30d
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="recordplatform-backend",status=~"5.."}[30d]))
            or 0 * sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[30d])))
          /
          sum(rate(http_server_requests_seconds_count{job="recordplatform-backend"}[30d]))

  # ============================================================================
  # Error Budget Remaining
  # Budget = 1 - (actual_error_rate / allowed_error_rate)
  # Values: 1.0 = full budget, 0.0 = exhausted, negative = over-budget
  # ============================================================================
  - name: sli:error_budget
    interval: 1m
    rules:
      # Upload error budget (target 99.5% => allowed failure rate 0.5%)
      - record: sli:upload_success:error_budget_remaining
        expr: |
          1 - (
            (1 - sli:upload_success:ratio_rate30d)
            /
            (1 - 0.995)
          )

      # API error budget (target <= 0.5% 5xx rate)
      - record: sli:api_error:error_budget_remaining
        expr: |
          1 - (
            sli:api_error:ratio_rate30d
            /
            0.005
          )
