rule_files:
  - ../recording-rules.yml
  - ../alerting-rules.yml
evaluation_interval: 30s
fuzzy_compare: true
group_eval_order:
  - sli:attestation_latency
  - sli:api_error
  - sli:upload_success
  - monitoring:collection
  - slo:attestation_latency

tests:
  - name: successful-api-without-ever-registering-5xx-is-zero-not-absent
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="recordplatform-backend",status="200"}'
        values: '0+100x65'
      - series: 'http_server_requests_seconds_count{job="unrelated",status="500"}'
        values: '0+10000x65'
    promql_expr_test:
      - expr: sli:api_error:ratio_rate5m
        eval_time: 61m
        exp_samples: [{labels: 'sli:api_error:ratio_rate5m', value: 0}]
      - expr: sli:api_error:ratio_rate30m
        eval_time: 61m
        exp_samples: [{labels: 'sli:api_error:ratio_rate30m', value: 0}]
      - expr: sli:api_error:ratio_rate1h
        eval_time: 61m
        exp_samples: [{labels: 'sli:api_error:ratio_rate1h', value: 0}]

  - name: real-api-errors-and-upload-outcomes-are-numerical
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="recordplatform-backend",status="200"}'
        values: '0+90x65'
      - series: 'http_server_requests_seconds_count{job="recordplatform-backend",status="500"}'
        values: '0+10x65'
      - series: 'saga_total_total{status="completed"}'
        values: '0+90x65'
      - series: 'saga_total_total{status="failed"}'
        values: '0+5x65'
      - series: 'saga_total_total{status="compensated"}'
        values: '0+5x65'
    promql_expr_test:
      - expr: sli:api_error:ratio_rate5m
        eval_time: 61m
        exp_samples: [{labels: 'sli:api_error:ratio_rate5m', value: 0.1}]
      - expr: sli:upload_success:ratio_rate5m
        eval_time: 61m
        exp_samples: [{labels: 'sli:upload_success:ratio_rate5m', value: 0.9}]

  - name: idle-api-and-upload-stay-undefined
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="recordplatform-backend",status="200"}'
        values: '0+0x10'
      - series: 'saga_total_total{status="completed"}'
        values: '0+0x10'
      - series: 'saga_total_total{status="failed"}'
        values: '0+0x10'
      - series: 'saga_total_total{status="compensated"}'
        values: '0+0x10'
    promql_expr_test:
      - expr: 'sli:api_error:ratio_rate5m == sli:api_error:ratio_rate5m'
        eval_time: 5m
        exp_samples: []
      - expr: 'sli:upload_success:ratio_rate5m == sli:upload_success:ratio_rate5m'
        eval_time: 5m
        exp_samples: []

  - name: absent-sources-stay-absent
    interval: 1m
    input_series: []
    promql_expr_test:
      - expr: 'sli:api_error:ratio_rate5m or sli:upload_success:ratio_rate5m or sli:storage_availability:ratio_current'
        eval_time: 5m
        exp_samples: []

  - name: histogram-seconds-and-all-rate-windows
    interval: 1m
    input_series:
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="1"}'
        values: '0+50x120'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="5"}'
        values: '0+90x120'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="10"}'
        values: '0+100x120'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="+Inf"}'
        values: '0+100x120'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="other",exported_job="record-platform-fisco",operation="storeFile",le="+Inf"}'
        values: '0+100000x120'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="unrelated",operation="storeFile",le="+Inf"}'
        values: '0+100000x120'
    promql_expr_test:
      - expr: sli:attestation_latency:p99_5m
        eval_time: 61m
        exp_samples: [{labels: 'sli:attestation_latency:p99_5m', value: 9.5}]
      - expr: sli:attestation_latency:p99_30m
        eval_time: 61m
        exp_samples: [{labels: 'sli:attestation_latency:p99_30m', value: 9.5}]
      - expr: sli:attestation_latency:p99_1h
        eval_time: 61m
        exp_samples: [{labels: 'sli:attestation_latency:p99_1h', value: 9.5}]
      - expr: 'histogram_quantile(0.5, sum by (le) (rate(otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile"}[5m])))'
        eval_time: 61m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: 'histogram_quantile(0.95, sum by (le) (rate(otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile"}[5m])))'
        eval_time: 61m
        # IEEE-754 rate/interpolation yields the nearest representable 7.5s estimate.
        exp_samples: [{labels: '{}', value: 7.4999999999999964}]
      - expr: 'histogram_quantile(0.99, sum by (le) (rate(otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile"}[5m])))'
        eval_time: 61m
        exp_samples: [{labels: '{}', value: 9.5}]
    alert_rule_test:
      - eval_time: 61m
        alertname: AttestationLatencyBurnCritical
        exp_alerts:
          - exp_labels: {severity: critical, slo: attestation_latency}
            exp_annotations:
              summary: 'Attestation P99 latency exceeds 5s SLO (critical)'
              description: 'Blockchain storeFile P99 latency has exceeded the 5-second SLO target in both 5m and 1h windows. Current 5m P99: 9.5s.'
              runbook: 'https://wiki.internal/runbooks/attestation-latency-slo'

  - name: histogram-aggregate-before-quantile
    interval: 1m
    input_series:
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="1"}'
        values: '0+50x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="5"}'
        values: '0+90x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="10"}'
        values: '0+100x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="a",le="+Inf"}'
        values: '0+100x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="b",le="1"}'
        values: '0+0x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="b",le="5"}'
        values: '0+0x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="b",le="10"}'
        values: '0+100x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",instance="b",le="+Inf"}'
        values: '0+100x10'
    promql_expr_test:
      - expr: sli:attestation_latency:p99_5m
        eval_time: 5m
        exp_samples: [{labels: 'sli:attestation_latency:p99_5m', value: 9.90909090909091}]

  - name: counter-reset-preserves-histogram-ratio
    interval: 1m
    input_series:
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",le="1"}'
        values: '0+50x3 0+50x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",le="5"}'
        values: '0+90x3 0+90x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",le="10"}'
        values: '0+100x3 0+100x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",le="+Inf"}'
        values: '0+100x3 0+100x10'
    promql_expr_test:
      - expr: sli:attestation_latency:p99_5m
        eval_time: 6m
        exp_samples: [{labels: 'sli:attestation_latency:p99_5m', value: 9.5}]

  - name: idle-and-never-used-timers-are-not-false-healthy
    interval: 1m
    input_series:
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",le="1"}'
        values: '0+0x10'
      - series: 'otel_blockchain_operation_duration_seconds_bucket{job="otel-collector",exported_job="record-platform-fisco",operation="storeFile",le="+Inf"}'
        values: '0+0x10'
    promql_expr_test:
      - expr: 'sli:attestation_latency:p99_5m == sli:attestation_latency:p99_5m'
        eval_time: 5m
        exp_samples: []
    alert_rule_test:
      - eval_time: 10m
        alertname: AttestationLatencyBurnCritical
        exp_alerts: []

  - name: no-configured-jobs-do-not-invent-outages
    interval: 1m
    input_series:
      - series: 'up{job="unrelated",instance="other"}'
        values: '0+0x10'
    promql_expr_test:
      - expr: 'ALERTS{slo="monitoring"}'
        eval_time: 10m
        exp_samples: []
      - expr: sli:attestation_latency:p99_5m
        eval_time: 10m
        exp_samples: []

  - name: target-down-hold-and-recovery
    interval: 30s
    input_series:
      - series: 'up{job="recordplatform-backend",instance="backend"}'
        values: '0+0x6 1+0x10'
    alert_rule_test:
      - eval_time: 90s
        alertname: RecordPlatformScrapeTargetDown
        exp_alerts: []
      - eval_time: 2m
        alertname: RecordPlatformScrapeTargetDown
        exp_alerts:
          - exp_labels: {job: recordplatform-backend, instance: backend, severity: critical, slo: monitoring}
            exp_annotations:
              summary: 'RecordPlatform scrape target is down'
              description: 'Configured target recordplatform-backend/backend has failed scraping for 2 minutes.'
      - eval_time: 4m
        alertname: RecordPlatformScrapeTargetDown
        exp_alerts: []

  - name: backend-business-missing-versus-present-zero
    interval: 1m
    input_series:
      - series: 'up{job="recordplatform-backend",instance="missing"}'
        values: '1+0x10'
      - series: 'up{job="recordplatform-backend",instance="present"}'
        values: '1+0x10'
      - series: 'saga_total_total{job="recordplatform-backend",instance="present",status="started"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RecordPlatformBackendMetricsMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: RecordPlatformBackendMetricsMissing
        exp_alerts:
          - exp_labels: {job: recordplatform-backend, instance: missing, severity: warning, slo: monitoring}
            exp_annotations:
              summary: 'Backend business metrics are missing'
              description: 'The configured backend scrape succeeds but its eagerly registered Saga meter is absent.'

  - name: fisco-missing-not-satisfied-by-another-workload
    interval: 1m
    input_series:
      - series: 'up{job="otel-collector",instance="collector"}'
        values: '1+0x10'
      - series: 'otel_blockchain_health{job="otel-collector",instance="collector",exported_job="unrelated"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: RecordPlatformFiscoBusinessMetricsMissing
        exp_alerts:
          - exp_labels: {job: otel-collector, instance: collector, severity: warning, slo: monitoring}
            exp_annotations:
              summary: 'FISCO business metrics are missing'
              description: 'Collector scrape succeeds but the FISCO Micrometer heartbeat is absent; inspect the provider bridge.'

  - name: idle-healthy-producers-and-zero-chain-health-are-present
    interval: 1m
    input_series:
      - series: 'up{job="otel-collector",instance="collector"}'
        values: '1+0x10'
      - series: 'otel_blockchain_health{job="otel-collector",instance="collector",exported_job="record-platform-fisco"}'
        values: '0+0x10'
      - series: 'otel_jvm_thread_count{job="otel-collector",instance="collector",exported_job="record-platform-web"}'
        values: '20+0x10'
      - series: 'otel_jvm_thread_count{job="otel-collector",instance="collector",exported_job="record-platform-fisco"}'
        values: '20+0x10'
      - series: 'otel_jvm_thread_count{job="otel-collector",instance="collector",exported_job="record-platform-storage"}'
        values: '20+0x10'
    promql_expr_test:
      - expr: 'ALERTS{slo="monitoring"}'
        eval_time: 10m
        exp_samples: []

  - name: only-missing-service-jvm-alerts-after-staleness
    interval: 1m
    input_series:
      - series: 'up{job="otel-collector",instance="collector"}'
        values: '1+0x20'
      - series: 'otel_jvm_thread_count{job="otel-collector",instance="collector",exported_job="record-platform-web"}'
        values: '20+0x20'
      - series: 'otel_jvm_thread_count{job="otel-collector",instance="collector",exported_job="record-platform-fisco"}'
        values: '20+0x20'
      - series: 'otel_jvm_thread_count{job="otel-collector",instance="collector",exported_job="record-platform-storage"}'
        values: '20 stale _ _ _ _ _ _ 20+0x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: RecordPlatformJvmMetricsMissing
        exp_alerts:
          - exp_labels: {job: otel-collector, instance: collector, severity: warning, slo: monitoring, service: record-platform-storage}
            exp_annotations:
              summary: 'Required service JVM metrics are missing'
              description: 'Collector scrape succeeds but JVM metrics for record-platform-storage are absent.'
      - eval_time: 9m
        alertname: RecordPlatformJvmMetricsMissing
        exp_alerts: []
