codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: false
        if_not_found: failure
        if_ci_failed: error

# 覆盖率仅采集可插桩的 TS 模块（vitest coverage.include = src/lib/**/*.ts）；
# .svelte 组件目前没有插桩数据，若计入 patch 统计会把纯模板改动误判为未覆盖。
ignore:
  - "platform-frontend/src/**/*.svelte"
  - "platform-frontend/src/app.html"

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true

flags:
  backend:
    paths:
      - platform-backend/
    carryforward: true
  frontend:
    paths:
      - platform-frontend/src/
    carryforward: true
