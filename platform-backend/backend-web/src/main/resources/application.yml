server:
  # 保留原始 socket peer；可信代理头只允许由 TrustedClientIpResolver 解析。
  forward-headers-strategy: none

spring:
  application:
    name: backend-web
  # Java 21 Virtual Threads - Tomcat 请求处理使用虚拟线程 (Spring Boot 3.5+)
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB
  profiles:
    active: local
  jackson:
    time-zone: GMT+8

  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true

  # RabbitMQ backpressure configuration
  rabbitmq:
    listener:
      simple:
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0
    health:
      queue: file.stored.queue

  security:
    jwt:
      key: ${JWT_KEY}
      expire: 72
      limit:
        base: 10
        upgrade: 300
        frequency: 30
    filter:
      order: -100

  web:
    verify:
      mail-limit: 60
    rate-limit:
      client-ip:
        trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    registration:
      tenant-id: ${PUBLIC_REGISTRATION_TENANT_ID:0}
    invitation:
      # Public frontend URL; override per deployment without embedding environment-specific hosts.
      accept-url: ${INVITATION_ACCEPT_URL:https://localhost/invitations/accept}
    flow:
      period: 3
      limit: 50
      block: 30
    cors:
      origin: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      credentials: true
      methods: GET,POST,PUT,DELETE,OPTIONS

record-platform:
  rpc:
    blockchain-token: ${BLOCKCHAIN_RPC_TOKEN}

# Platform identity is opt-in until V1.21.0 is migrated and bootstrap is complete.
security:
  platform-identity:
    enabled: ${PLATFORM_IDENTITY_ENABLED:false}
  authorization-state:
    cache-ttl: ${AUTHORIZATION_STATE_CACHE_TTL:30s}

# One-time local password-file bootstrap. Never place password content in configuration.
platform:
  bootstrap:
    enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
    username: ${PLATFORM_BOOTSTRAP_USERNAME:}
    email: ${PLATFORM_BOOTSTRAP_EMAIL:}
    password-file: ${PLATFORM_BOOTSTRAP_PASSWORD_FILE:}

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "用户认证服务"
      paths-to-match: "/api/v1/auth/**,/api/v1/users/**,/api/auth/**"
      packages-to-scan: cn.flying.controller
    - group: "文件存储服务"
      paths-to-match: "/api/v1/files/**,/api/v1/images/**"
      packages-to-scan: cn.flying.controller
    - group: "消息通信服务"
      paths-to-match: "/api/v1/conversations/**,/api/v1/messages/**,/api/v1/sse/**"
      packages-to-scan: cn.flying.controller
    - group: "系统管理服务"
      paths-to-match: "/api/v1/system/**,/api/v1/admin/**,/api/v1/public/invitations/**,/api/v1/announcements/**,/api/v1/tickets/**"
      packages-to-scan: cn.flying.controller

# knife4j配置
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  production: ${KNIFE4J_PRODUCTION:true}
  basic:
    enable: ${KNIFE4J_BASIC_ENABLE:true}
    username: ${KNIFE4J_USERNAME}
    password: ${KNIFE4J_PASSWORD}
  setting:
    language: zh_cn
    enable-group: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    #打印sql日志
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

  global-config:
    #控制台mybatis-plus标记
    banner: true
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值
      logic-not-delete-value: 0 # 逻辑未删除值
      id-type: INPUT

snowflake:
  worker-id: 1
  data-center-id: 20

# 雪花ID生成器配置（ID加密使用JWT密钥派生，无需额外配置）

# Resilience4j 熔断与重试配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 50
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      blockChainService:
        base-config: default
        slow-call-duration-threshold: 5s
      storageService:
        base-config: default
        slow-call-duration-threshold: 8s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.apache.dubbo.remoting.RemotingException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      blockChainService:
        base-config: default
      storageService:
        base-config: default
  ratelimiter:
    instances:
      fileKeyAccessRateLimiter:
        limit-for-period: 20
        limit-refresh-period: 60s
        timeout-duration: 1s

# File cleanup task configuration
file:
  cleanup:
    retention-days: 30
    batch-size: 100
    cron: 0 0 3 * * ?
  # Chunk encryption configuration
  encryption:
    # Algorithm: aes-gcm (recommended for servers with AES-NI), chacha20 (recommended for containers/mixed environments), auto
    algorithm: auto
    # Run benchmark on startup to auto-select optimal algorithm (only for 'auto' mode)
    benchmark-on-startup: true
    # Benchmark data size in bytes (default 1MB)
    benchmark-data-size: 1048576
    # Benchmark iterations
    benchmark-iterations: 3
    # 普通后端代理上传的对象格式；切回 v1 仅影响新上传，reader 始终保留兼容能力。
    writer-format: v2
    frame-plain-size: 1048576
  key-envelope:
    active-provider: ${FILE_KEY_ENVELOPE_ACTIVE_PROVIDER:local}
    active-provider-contract-version: ${FILE_KEY_ENVELOPE_ACTIVE_PROVIDER_CONTRACT_VERSION:1}
    providers:
      local:
        key-id: ${FILE_KEY_ENVELOPE_LOCAL_KEY_ID:local-file-key-v1}
        historical-key-ids: ${FILE_KEY_ENVELOPE_LOCAL_HISTORICAL_KEY_IDS:}
        # Local/dev compatibility may reuse JWT_KEY; application-prod.yml removes this fallback.
        master-key: ${FILE_KEY_ENVELOPE_MASTER_KEY:${JWT_KEY:}}
        # Keep old versions configured until rewrap completes.
        # master-keys:
        #   1: ${FILE_KEY_ENVELOPE_MASTER_KEY_V1:${FILE_KEY_ENVELOPE_MASTER_KEY:${JWT_KEY:}}}
        #   2: ${FILE_KEY_ENVELOPE_MASTER_KEY_V2:}
      vault-transit:
        address: ${FILE_KEY_ENVELOPE_VAULT_ADDRESS:}
        token: ${FILE_KEY_ENVELOPE_VAULT_TOKEN:}
        namespace: ${FILE_KEY_ENVELOPE_VAULT_NAMESPACE:}
        mount: ${FILE_KEY_ENVELOPE_VAULT_MOUNT:transit}
        key-name: ${FILE_KEY_ENVELOPE_VAULT_KEY_NAME:}
        key-version: ${FILE_KEY_ENVELOPE_VAULT_KEY_VERSION:1}
        allow-http: ${FILE_KEY_ENVELOPE_VAULT_ALLOW_HTTP:false}
        connect-timeout: ${FILE_KEY_ENVELOPE_VAULT_CONNECT_TIMEOUT:2s}
        request-timeout: ${FILE_KEY_ENVELOPE_VAULT_REQUEST_TIMEOUT:5s}
        max-request-bytes: ${FILE_KEY_ENVELOPE_VAULT_MAX_REQUEST_BYTES:65536}
        max-response-bytes: ${FILE_KEY_ENVELOPE_VAULT_MAX_RESPONSE_BYTES:65536}
    key-version: 1
    algorithm-suite: RP-AES256-GCM-CHUNK-CHAIN-V1
    signature-suite: UNSIGNED-V1
    kem-suite: NONE-V1
    proof-suite: RP-MERKLE-SHA256-V1
    encryption-algorithm: CHUNK_KEY_CHAIN
    wrapping-algorithm: AES-256-GCM
    # Optional ISO-8601 instant. Once reached, new envelope/proof metadata using this suite is rejected.
    # deprecated-after: 2030-01-01T00:00:00Z
    supported-algorithm-suites:
      - RP-AES256-GCM-CHUNK-CHAIN-V1
      - RP-AES256-GCM-FRAMED-V2
    supported-signature-suites:
      - UNSIGNED-V1
    supported-kem-suites:
      - NONE-V1
    supported-proof-suites:
      - RP-MERKLE-SHA256-V1
    deprecated-suites: []
  # Browser key delivery uses short-lived one-time grants; plaintext-v0 is migration-only.
  key-delivery:
    grant-ttl: ${FILE_KEY_DELIVERY_GRANT_TTL:60s}
    retry-window: ${FILE_KEY_DELIVERY_RETRY_WINDOW:10s}
    max-same-session-retries: ${FILE_KEY_DELIVERY_MAX_SAME_SESSION_RETRIES:1}
    legacy-plaintext-enabled: ${FILE_KEY_DELIVERY_LEGACY_PLAINTEXT_ENABLED:false}
    legacy-plaintext-not-after: ${FILE_KEY_DELIVERY_LEGACY_PLAINTEXT_NOT_AFTER:2026-10-01T00:00:00Z}

# Automated envelope rotation is opt-in; durable tenant policies own business limits.
key:
  rotation:
    enabled: ${KEY_ROTATION_ENABLED:false}
    poll-interval-ms: ${KEY_ROTATION_POLL_INTERVAL_MS:30000}
    initial-delay-ms: ${KEY_ROTATION_INITIAL_DELAY_MS:30000}
    max-tenants-per-poll: ${KEY_ROTATION_MAX_TENANTS_PER_POLL:100}

# Closed runtime suite catalog. Tenant policy overrides are persisted in tenant_crypto_policy.
crypto:
  agility:
    production-mode: ${CRYPTO_AGILITY_PRODUCTION_MODE:true}
    allow-experimental-writes: ${CRYPTO_AGILITY_ALLOW_EXPERIMENTAL_WRITES:false}
    signing-provider: ${CRYPTO_AGILITY_SIGNING_PROVIDER:local-ed25519}
    signing-provider-contract-version: ${CRYPTO_AGILITY_SIGNING_PROVIDER_CONTRACT_VERSION:1}
    signed-proof-signature-suite: ${CRYPTO_AGILITY_SIGNED_PROOF_SIGNATURE_SUITE:JWS-EDDSA-ED25519-V1}
    signed-proof-suite: ${CRYPTO_AGILITY_SIGNED_PROOF_SUITE:RP-SIGNED-PROOF-ZIP-V2}
    # Operators may only tighten lifecycle for known catalog IDs; unknown entries fail startup.
    suite-lifecycle: {}

# Quota governance configuration
quota:
  enforcement-mode: SHADOW
  rollout:
    strategy: TENANT_WHITELIST
    enforce-tenant-whitelist:
    force-shadow: false
    batch-id: default
  alert:
    enabled: true
    storage-drift-ratio-threshold: 0.01
    file-count-drift-threshold: 1
  default:
    user:
      max-storage-bytes: 5368709120
      max-file-count: 10000
    tenant:
      max-storage-bytes: 107374182400
      max-file-count: 500000
  reconcile:
    cron: 0 0/30 * * * ?

# Production Merkle batch admission and flush (disabled until explicitly rolled out)
attestation:
  production:
    enabled: false
    poll-interval-ms: 30000
    initial-delay-ms: 30000
    min-batch-size: 50
    max-batch-size: 100
    max-wait-seconds: 600
    seed-limit: 200
    max-batches-per-run: 2
    claim-lease-seconds: 120
    candidate-max-attempts: 3

# Dedicated signed-proof issuer key (disabled and fail-closed until explicitly configured)
proof:
  signing:
    enabled: ${PROOF_SIGNING_ENABLED:false}
    algorithm: Ed25519
    key-id: ${PROOF_SIGNING_KEY_ID:}
    key-version: ${PROOF_SIGNING_KEY_VERSION:1}
    key-status: ${PROOF_SIGNING_KEY_STATUS:DISABLED}
    private-key-pkcs8: ${PROOF_SIGNING_PRIVATE_KEY_PKCS8:}
    public-key-spki: ${PROOF_SIGNING_PUBLIC_KEY_SPKI:}

# Storage integrity check
integrity:
  check:
    enabled: true
    sample-rate: 0.01
    batch-size: 50
    lock-timeout-seconds: 1800
    distribution:
      lightweight: 0.99    # Manifest-backed HEAD metadata checks
      medium: 0.009        # Canonical manifest and ordered chunk checks
      heavy: 0.001         # Sampled chunk hash plus blockchain checks
    heavy:
      sample-chunks: 1
      max-download-bytes: 83886080 # 80 MiB, matches the direct-upload chunk limit
    schedule:
      cron: "0 0 2 * * ?"  # 2 AM daily

# Outbox publisher configuration
outbox:
  publisher:
    batch-size: 100
    max-retries: 5
    poll-interval-ms: 2000
  health:
    pending-threshold: 500 # 待发送事件超过此值标记为 DEGRADED
    failed-threshold: 20 # 失败事件超过此值标记为 DOWN
  cleanup:
    sent-retention-days: 7 # 已发送事件保留天数
    failed-retention-days: 30 # 永久失败事件保留天数
    cron: 0 0 3 * * ? # 每天凌晨3点清理

# Processed message cleanup
processed-message:
  cleanup:
    retention-days: 7
    cron: 0 30 3 * * ?

# Saga compensation configuration
saga:
  upload:
    # Legacy backend-proxied chunk uploads use Dubbo byte[] payloads; keep below 100MB Dubbo payload.
    max-in-memory-chunk-bytes: 83886080
  compensation:
    max-retries: 5
    batch-size: 50
    poll-interval-ms: 30000
  health:
    running-threshold: 100 # 运行中 Saga 超过此值标记为 DEGRADED
    failed-threshold: 10 # 失败 Saga 超过此值标记为 DOWN
    pending-compensation-threshold: 50 # 待补偿 Saga 超过此值标记为 DEGRADED

# 过期分享状态清理间隔
share:
  cleanup:
    interval: 300000

# Actuator 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
      probes:
        enabled: true
  health:
    remote-rpc:
      enabled: false
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    circuitbreakers:
      enabled: true

# Local-only load testing seed data (k6)
loadtest:
  seed:
    enabled: false
    tenant-id: 1
    tenant-code: loadtest
    tenant-name: LoadTest
    username: loadtest
    password: ${LOADTEST_PASSWORD:}
